openapi: 3.0.3
components:
  schemas:
    AcquisitionType:
      description:
        An enum describing how a player was aquired to fill a roster spot.
      type: string
      enum:
        - DRAFT
        - ADD
        - TRADE

    BasicLeagueMember:
      description: The users that are part of the league.
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        isLeagueManager:
          type: boolean

    BasicLeagueResponse:
      description: The basic information returned with all league responses.
      type: object
      properties:
        gameId:
          type: integer
        id:
          type: integer
          description: The league id.
        scoringPeriodId:
          type: integer
        seasonId:
          type: integer
          description: The year of the fantasy season.
        segmentId:
          type: integer

    BasketballStats:
      description: A collection of basketball statistics keyed by ESPN stat ID.
      type: object
      properties:
        0:
          description: Points (PTS).
          type: number
          format: float
          minimum: 0.0
        1:
          description: Blocks (BLK).
          type: number
          format: float
          minimum: 0.0
        2:
          description: Steals (STL).
          type: number
          format: float
          minimum: 0.0
        3:
          description: Assists (AST).
          type: number
          format: float
          minimum: 0.0
        4:
          description: Offensive Rebounds (OREB).
          type: number
          format: float
          minimum: 0.0
        5:
          description: Defensive Rebounds (DREB).
          type: number
          format: float
          minimum: 0.0
        6:
          description: Rebounds (REB) - Total rebounds (OREB + DREB).
          type: number
          format: float
          minimum: 0.0
        7:
          description: Disqualifications / Fouled Out (DQ).
          type: number
          format: float
          minimum: 0.0
        8:
          description: Flagrant Fouls (FF).
          type: number
          format: float
          minimum: 0.0
        9:
          description: Personal Fouls (PF).
          type: number
          format: float
          minimum: 0.0
        10:
          description: Technical Fouls (TF).
          type: number
          format: float
          minimum: 0.0
        11:
          description: Turnovers (TO).
          type: number
          format: float
          minimum: 0.0
        12:
          description: Ejections (EJ).
          type: number
          format: float
          minimum: 0.0
        13:
          description: Field Goals Made (FGM).
          type: number
          format: float
          minimum: 0.0
        14:
          description: Field Goals Attempted (FGA).
          type: number
          format: float
          minimum: 0.0
        15:
          description: Free Throws Made (FTM).
          type: number
          format: float
          minimum: 0.0
        16:
          description: Free Throws Attempted (FTA).
          type: number
          format: float
          minimum: 0.0
        17:
          description: 3-Point Field Goals Made (3PM).
          type: number
          format: float
          minimum: 0.0
        18:
          description: 3-Point Field Goals Attempted (3PA).
          type: number
          format: float
          minimum: 0.0
        19:
          description: Field Goal Percentage (FG% = FGM / FGA).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        20:
          description: Free Throw Percentage (FT% = FTM / FTA).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        21:
          description: 3-Point Field Goal Percentage (3P% = 3PM / 3PA).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        22:
          description:
            Effective Field Goal Percentage (eFG% = (FGM + 0.5 * 3PM) / FGA).
          type: number
          format: float
          minimum: 0.0
        23:
          description: Field Goals Missed (FGMI = FGA - FGM).
          type: number
          format: float
          minimum: 0.0
        24:
          description: Free Throws Missed (FTMI = FTA - FTM).
          type: number
          format: float
          minimum: 0.0
        25:
          description: 3-Point Field Goals Missed (3PMI = 3PA - 3PM).
          type: number
          format: float
          minimum: 0.0
        26:
          description: Assists Per Game (APG).
          type: number
          format: float
          minimum: 0.0
        27:
          description: Blocks Per Game (BPG).
          type: number
          format: float
          minimum: 0.0
        28:
          description: Minutes Per Game (MPG).
          type: number
          format: float
          minimum: 0.0
        29:
          description: Points Per Game (PPG).
          type: number
          format: float
          minimum: 0.0
        30:
          description: Rebounds Per Game (RPG).
          type: number
          format: float
          minimum: 0.0
        31:
          description: Steals Per Game (SPG).
          type: number
          format: float
          minimum: 0.0
        32:
          description: Turnovers Per Game (TOPG).
          type: number
          format: float
          minimum: 0.0
        33:
          description: 3-Point Field Goals Made Per Game (3PMG).
          type: number
          format: float
          minimum: 0.0
        34:
          description: Points Per Minute (PPM = PTS / MIN).
          type: number
          format: float
          minimum: 0.0
        35:
          description: Assist-to-Turnover Ratio (AST / TO).
          type: number
          format: float
          minimum: 0.0
        36:
          description: Steal-to-Turnover Ratio (STL / TO).
          type: number
          format: float
          minimum: 0.0
        37:
          description: Double-Doubles (DD).
          type: number
          format: float
          minimum: 0.0
        38:
          description: Triple-Doubles (TD).
          type: number
          format: float
          minimum: 0.0
        39:
          description: Quadruple-Doubles (QD).
          type: number
          format: float
          minimum: 0.0
        40:
          description: Minutes Played (MIN).
          type: number
          format: float
          minimum: 0.0
        41:
          description: Games Played (GP).
          type: number
          format: float
          minimum: 0.0
        42:
          description: Games Started (GS).
          type: number
          format: float
          minimum: 0.0
        43:
          description: Team Wins (W) in games played.
          type: number
          format: float
          minimum: 0.0
        44:
          description: Free Throw Attempt Rate (FTr = FTA / FGA).
          type: number
          format: float
          minimum: 0.0

    DraftDetails:
      type: object
      properties:
        drafted:
          type: boolean
        inProgress:
          type: boolean

    InjuryStatus:
      description:
        The injury/reservation status of a roster slot, indicating whether a
        player is in a normal slot or pending movement to/from an Injured
        Reserve (IR) slot.
      type: string
      enum:
        - NORMAL
        - FUTURE_TO_IR
        - FUTURE_FROM_IR

    PlayerInjuryStatus:
      description: The physical injury status of an individual player.
      type: string
      enum:
        - ACTIVE
        - DAY_TO_DAY
        - OUT
        - QUESTIONABLE
        - DOUBTFUL
        - SUSPENSION

    BasketballPositionId:
      description:
        The primary basketball position identifier (defaultPositionId).
      type: integer
      enum:
        - 1 # Point Guard (PG)
        - 2 # Shooting Guard (SG)
        - 3 # Small Forward (SF)
        - 4 # Power Forward (PF)
        - 5 # Center (C)

    BasketballLineupSlotId:
      description:
        The lineup slot identifier used for roster positions and eligibility.
      type: integer
      enum:
        - 0 # Point Guard (PG)
        - 1 # Shooting Guard (SG)
        - 2 # Small Forward (SF)
        - 3 # Power Forward (PF)
        - 4 # Center (C)
        - 5 # Guard (G: PG/SG)
        - 6 # Forward (F: SF/PF)
        - 7 # Guard / Forward (SG/SF)
        - 8 # Guard / Forward (G/F)
        - 9 # Forward / Center (PF/C)
        - 10 # Forward / Center (F/C)
        - 11 # Utility (UTIL)
        - 12 # Bench (BE)
        - 13 # Injured Reserve (IR)

    LeagueStatusBasic:
      type: object
      properties:
        currentMatchupPeriod:
          type: integer
        isActive:
          type: boolean
        latestScoringPeriod:
          type: integer

    LeagueStatusDetailed:
      description:
        The league status returned when the view query parameter is mTeam.
      allOf:
        - $ref: '#/components/schemas/LeagueStatusBasic'
        - type: object
          properties:
            activatedDate:
              type: integer
            createdAsLeagueType:
              type: integer
            currentLeagueType:
              type: integer
            currentMatchupPeriod:
              type: integer
            finalScoringPeriod:
              type: integer
            firstScoringPeriod:
              type: integer
            isActive:
              type: boolean
            isExpired:
              type: boolean
            isFull:
              description: If the league has every team filled.
              type: boolean
            isPlayoffMatchupEdited:
              type: boolean
            isToBeDeleted:
              type: boolean
            isViewable:
              description:
                This might have to do with whether the league is private.
              type: boolean
            isWaiverOrderEdited:
              type: boolean
            latestScoringPeriod:
              type: integer
            previousSeasons:
              description:
                a list of the previous seasonYears the league was active.
              type: array
              items:
                type: integer
            standingsUpdateDate:
              type: integer
            teamsJoined:
              description: The number of teams in the league.
              type: integer
            transactionScoringPeriod:
              type: integer
            waiverLastExecutionDate:
              type: integer
            waiverProcessStatus:
              type: object
              additionalProperties:
                type: integer
              example:
                '2021-04-20T09:35:02.088+0000': 2

    LeagueTeamBasic:
      type: object
      properties:
        abbrev:
          description: The abbreviation used to represent the team.
          type: string
          format: allcaps
        id:
          description:
            A unique identifier specific to the team, league, and season.
          type: integer
          minimum: 1
          example: 5
        location:
          description: Part of the team name.
          type: string
        nickname:
          description: Part of the team name.
          type: string
        owners:
          description: A list of users who own the team.
          type: array
          items:
            type: string
            format: uuid

    PlayerBasic:
      description: An object describing a professional player.
      type: object
      properties:
        defaultPositionId:
          description:
            'The primary position ID of the player (1: PG, 2: SG, 3: SF, 4: PF,
            5: C).'
          $ref: '#/components/schemas/BasketballPositionId'
        droppable:
          description: Whether the player can be dropped by a fantasy manager.
          type: boolean
        eligibleSlots:
          description:
            The lineup slot IDs that the player is eligible to fill in the
            league roster.
          type: array
          items:
            $ref: '#/components/schemas/BasketballLineupSlotId'
        firstName:
          description: The first name of the player.
          type: string
          example: Precious
        fullName:
          description: The full name of the player.
          type: string
          example: Precious Achiuwa
        id:
          description: The unique identifier for the professional player.
          type: integer
          example: 4431679
        injured:
          description: Whether the player is currently injured.
          type: boolean
        injuryStatus:
          $ref: '#/components/schemas/PlayerInjuryStatus'
        lastName:
          description: The last name of the player.
          type: string
          example: Achiuwa
        lastNewsDate:
          description:
            Timestamp in milliseconds when news was last published for the
            player.
          type: integer
        ownership:
          description:
            Aggregate information about the players ownership across ESPN
            leagues.
          $ref: '#/components/schemas/PlayerOwnership'
        proTeamId:
          description:
            'An identifier indicating which NBA team the player is on (0: Free
            Agent, 1-30: NBA teams).'
          type: integer
          minimum: 0
          example: 28
        universeId:
          description: Identifier for the sport universe (e.g. 2 for NBA).
          type: integer

    PlayerOwnership:
      description:
        Aggregate information about a players ownership across ESPN leagues.
      type: object
      properties:
        auctionValueAverage:
          description:
            The average price paid for the player in auction league drafts.
          type: number
          format: float
        averageDraftPosition:
          description:
            The average pick the player was drafted in traditional drafts.
          type: number
          format: float
          minimum: 1.0
        percentChange:
          type: number
          format: float
        percentOwned:
          description:
            The percent of leagues where the player is owned by a manager.
          type: number
          format: float
          minimum: 0.0
        percentStarted:
          type: number
          format: float

    PlayerPoolEntryStatus:
      description: The status of a player within the fantasy league pool.
      type: string
      enum:
        - ONTEAM
        - WAIVERS
        - FREEAGENT

    PlayerRatings:
      description:
        Information about how a player stacks up over a specific time period.
      type: object
      properties:
        positionalRanking:
          description:
            How the player is ranked within its position over the time period.
            This is most likely based on total fantasy points accumulated during
            the time period.
          type: number
          format: integer
          example: 9
        totalRanking:
          description:
            How the player is ranked against all other players over the time
            period. This is most likely based on the total fantasy points
            accumulated during the time period.
          type: number
          format: integer
          example: 27
        totalRating:
          description:
            The total fantasy points accumulated during the time time period.
          type: number
          format: float
          example: 119.0
