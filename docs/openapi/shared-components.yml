openapi: 3.0.3
components:
  schemas:
    AcquisitionType:
      description:
        An enum describing how a player was aquired to fill a roster spot.
      type: string
      enum:
        - DRAFT
        - ADD
        - TRADE

    BasicLeagueMember:
      description: The users that are part of the league.
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        isLeagueManager:
          type: boolean

    BasicLeagueResponse:
      description: The basic information returned with all league responses.
      type: object
      properties:
        gameId:
          type: integer
        id:
          type: integer
          description: The league id.
        scoringPeriodId:
          type: integer
        seasonId:
          type: integer
          description: The year of the fantasy season.
        segmentId:
          type: integer

    BasketballStats:
      description: A collection of basketball statistics keyed by ESPN stat ID.
      type: object
      properties:
        0:
          description: Points (PTS).
          type: number
          format: float
          minimum: 0.0
        1:
          description: Blocks (BLK).
          type: number
          format: float
          minimum: 0.0
        2:
          description: Steals (STL).
          type: number
          format: float
          minimum: 0.0
        3:
          description: Assists (AST).
          type: number
          format: float
          minimum: 0.0
        4:
          description: Offensive Rebounds (OREB).
          type: number
          format: float
          minimum: 0.0
        5:
          description: Defensive Rebounds (DREB).
          type: number
          format: float
          minimum: 0.0
        6:
          description: Rebounds (REB) - Total rebounds (OREB + DREB).
          type: number
          format: float
          minimum: 0.0
        7:
          description: Disqualifications / Fouled Out (DQ).
          type: number
          format: float
          minimum: 0.0
        8:
          description: Flagrant Fouls (FF).
          type: number
          format: float
          minimum: 0.0
        9:
          description: Personal Fouls (PF).
          type: number
          format: float
          minimum: 0.0
        10:
          description: Technical Fouls (TF).
          type: number
          format: float
          minimum: 0.0
        11:
          description: Turnovers (TO).
          type: number
          format: float
          minimum: 0.0
        12:
          description: Ejections (EJ).
          type: number
          format: float
          minimum: 0.0
        13:
          description: Field Goals Made (FGM).
          type: number
          format: float
          minimum: 0.0
        14:
          description: Field Goals Attempted (FGA).
          type: number
          format: float
          minimum: 0.0
        15:
          description: Free Throws Made (FTM).
          type: number
          format: float
          minimum: 0.0
        16:
          description: Free Throws Attempted (FTA).
          type: number
          format: float
          minimum: 0.0
        17:
          description: 3-Point Field Goals Made (3PM).
          type: number
          format: float
          minimum: 0.0
        18:
          description: 3-Point Field Goals Attempted (3PA).
          type: number
          format: float
          minimum: 0.0
        19:
          description: Field Goal Percentage (FG% = FGM / FGA).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        20:
          description: Free Throw Percentage (FT% = FTM / FTA).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        21:
          description: 3-Point Field Goal Percentage (3P% = 3PM / 3PA).
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        22:
          description:
            Effective Field Goal Percentage (eFG% = (FGM + 0.5 * 3PM) / FGA).
          type: number
          format: float
          minimum: 0.0
        23:
          description: Field Goals Missed (FGMI = FGA - FGM).
          type: number
          format: float
          minimum: 0.0
        24:
          description: Free Throws Missed (FTMI = FTA - FTM).
          type: number
          format: float
          minimum: 0.0
        25:
          description: 3-Point Field Goals Missed (3PMI = 3PA - 3PM).
          type: number
          format: float
          minimum: 0.0
        26:
          description: Assists Per Game (APG).
          type: number
          format: float
          minimum: 0.0
        27:
          description: Blocks Per Game (BPG).
          type: number
          format: float
          minimum: 0.0
        28:
          description: Minutes Per Game (MPG).
          type: number
          format: float
          minimum: 0.0
        29:
          description: Points Per Game (PPG).
          type: number
          format: float
          minimum: 0.0
        30:
          description: Rebounds Per Game (RPG).
          type: number
          format: float
          minimum: 0.0
        31:
          description: Steals Per Game (SPG).
          type: number
          format: float
          minimum: 0.0
        32:
          description: Turnovers Per Game (TOPG).
          type: number
          format: float
          minimum: 0.0
        33:
          description: 3-Point Field Goals Made Per Game (3PMG).
          type: number
          format: float
          minimum: 0.0
        34:
          description: Points Per Minute (PPM = PTS / MIN).
          type: number
          format: float
          minimum: 0.0
        35:
          description: Assist-to-Turnover Ratio (AST / TO).
          type: number
          format: float
          minimum: 0.0
        36:
          description: Steal-to-Turnover Ratio (STL / TO).
          type: number
          format: float
          minimum: 0.0
        37:
          description: Double-Doubles (DD).
          type: number
          format: float
          minimum: 0.0
        38:
          description: Triple-Doubles (TD).
          type: number
          format: float
          minimum: 0.0
        39:
          description: Quadruple-Doubles (QD).
          type: number
          format: float
          minimum: 0.0
        40:
          description: Minutes Played (MIN).
          type: number
          format: float
          minimum: 0.0
        41:
          description: Games Played (GP).
          type: number
          format: float
          minimum: 0.0
        42:
          description: Games Started (GS).
          type: number
          format: float
          minimum: 0.0
        43:
          description: Team Wins (W) in games played.
          type: number
          format: float
          minimum: 0.0
        44:
          description: Free Throw Attempt Rate (FTr = FTA / FGA).
          type: number
          format: float
          minimum: 0.0

    DraftDetails:
      type: object
      properties:
        drafted:
          type: boolean
        inProgress:
          type: boolean

    InjuryStatus:
      description:
        The injury/reservation status of a roster slot, indicating whether a
        player is in a normal slot or pending movement to/from an Injured
        Reserve (IR) slot.
      type: string
      enum:
        - NORMAL
        - FUTURE_TO_IR
        - FUTURE_FROM_IR

    PlayerInjuryStatus:
      description: The physical injury status of an individual player.
      type: string
      enum:
        - ACTIVE
        - DAY_TO_DAY
        - OUT
        - QUESTIONABLE
        - DOUBTFUL
        - SUSPENSION

    BasketballPositionId:
      description:
        The primary basketball position identifier (defaultPositionId).
      type: integer
      enum:
        - 1 # Point Guard (PG)
        - 2 # Shooting Guard (SG)
        - 3 # Small Forward (SF)
        - 4 # Power Forward (PF)
        - 5 # Center (C)

    BasketballLineupSlotId:
      description:
        The lineup slot identifier used for roster positions and eligibility.
      type: integer
      enum:
        - 0 # Point Guard (PG)
        - 1 # Shooting Guard (SG)
        - 2 # Small Forward (SF)
        - 3 # Power Forward (PF)
        - 4 # Center (C)
        - 5 # Guard (G: PG/SG)
        - 6 # Forward (F: SF/PF)
        - 7 # Guard / Forward (SG/SF)
        - 8 # Guard / Forward (G/F)
        - 9 # Forward / Center (PF/C)
        - 10 # Forward / Center (F/C)
        - 11 # Utility (UTIL)
        - 12 # Bench (BE)
        - 13 # Injured Reserve (IR)

    LeagueStatusBasic:
      type: object
      properties:
        currentMatchupPeriod:
          type: integer
        isActive:
          type: boolean
        latestScoringPeriod:
          type: integer

    LeagueStatusDetailed:
      description:
        The league status returned when the view query parameter is mTeam.
      allOf:
        - $ref: '#/components/schemas/LeagueStatusBasic'
        - type: object
          properties:
            activatedDate:
              type: integer
            createdAsLeagueType:
              type: integer
            currentLeagueType:
              type: integer
            currentMatchupPeriod:
              type: integer
            finalScoringPeriod:
              type: integer
            firstScoringPeriod:
              type: integer
            isActive:
              type: boolean
            isExpired:
              type: boolean
            isFull:
              description: If the league has every team filled.
              type: boolean
            isPlayoffMatchupEdited:
              type: boolean
            isToBeDeleted:
              type: boolean
            isViewable:
              description:
                This might have to do with whether the league is private.
              type: boolean
            isWaiverOrderEdited:
              type: boolean
            latestScoringPeriod:
              type: integer
            previousSeasons:
              description:
                a list of the previous seasonYears the league was active.
              type: array
              items:
                type: integer
            standingsUpdateDate:
              type: integer
            teamsJoined:
              description: The number of teams in the league.
              type: integer
            transactionScoringPeriod:
              type: integer
            waiverLastExecutionDate:
              type: integer
            waiverProcessStatus:
              type: object
              additionalProperties:
                type: integer
              example:
                '2021-04-20T09:35:02.088+0000': 2

    LeagueTeamBasic:
      type: object
      properties:
        abbrev:
          description: The abbreviation used to represent the team.
          type: string
          format: allcaps
        id:
          description:
            A unique identifier specific to the team, league, and season.
          type: integer
          minimum: 1
          example: 5
        location:
          description: Part of the team name.
          type: string
        nickname:
          description: Part of the team name.
          type: string
        owners:
          description: A list of users who own the team.
          type: array
          items:
            type: string
            format: uuid

    PlayerBasic:
      description: An object describing a professional player.
      type: object
      properties:
        defaultPositionId:
          description:
            'The primary position ID of the player (1: PG, 2: SG, 3: SF, 4: PF,
            5: C).'
          $ref: '#/components/schemas/BasketballPositionId'
        droppable:
          description: Whether the player can be dropped by a fantasy manager.
          type: boolean
        eligibleSlots:
          description:
            The lineup slot IDs that the player is eligible to fill in the
            league roster.
          type: array
          items:
            $ref: '#/components/schemas/BasketballLineupSlotId'
        firstName:
          description: The first name of the player.
          type: string
          example: Precious
        fullName:
          description: The full name of the player.
          type: string
          example: Precious Achiuwa
        id:
          description: The unique identifier for the professional player.
          type: integer
          example: 4431679
        injured:
          description: Whether the player is currently injured.
          type: boolean
        injuryStatus:
          $ref: '#/components/schemas/PlayerInjuryStatus'
        lastName:
          description: The last name of the player.
          type: string
          example: Achiuwa
        lastNewsDate:
          description:
            Timestamp in milliseconds when news was last published for the
            player.
          type: integer
        ownership:
          description:
            Aggregate information about the players ownership across ESPN
            leagues.
          $ref: '#/components/schemas/PlayerOwnership'
        proTeamId:
          description:
            An identifier indicating which NBA team the player is on (0 for Free
            Agent, 1-30 for NBA teams).
          type: integer
          minimum: 0
          example: 28
        universeId:
          description: Identifier for the sport universe (e.g. 2 for NBA).
          type: integer

    PlayerOwnership:
      description:
        Aggregate information about a players ownership across ESPN leagues.
      type: object
      properties:
        auctionValueAverage:
          description:
            The average price paid for the player in auction league drafts.
          type: number
          format: float
        averageDraftPosition:
          description:
            The average pick the player was drafted in traditional drafts.
          type: number
          format: float
          minimum: 1.0
        percentChange:
          type: number
          format: float
        percentOwned:
          description:
            The percent of leagues where the player is owned by a manager.
          type: number
          format: float
          minimum: 0.0
        percentStarted:
          type: number
          format: float

    PlayerPoolEntryStatus:
      description: The status of a player within the fantasy league pool.
      type: string
      enum:
        - ONTEAM
        - WAIVERS
        - FREEAGENT

    PlayerRatings:
      description:
        Information about how a player stacks up over a specific time period.
      type: object
      properties:
        positionalRanking:
          description:
            How the player is ranked within its position over the time period.
            This is most likely based on total fantasy points accumulated during
            the time period.
          type: number
          format: integer
          example: 9
        totalRanking:
          description:
            How the player is ranked against all other players over the time
            period. This is most likely based on the total fantasy points
            accumulated during the time period.
          type: number
          format: integer
          example: 27
        totalRating:
          description:
            The total fantasy points accumulated during the time time period.
          type: number
          format: float
          example: 119.0

    Roster:
      description: The roster of a fantasy team in the league.
      type: object
      properties:
        appliedStatTotal:
          description: Total applied fantasy points scored by this roster.
          type: number
          format: float
        entries:
          description: A list of the players on the roster.
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
        tradeReservedEntries:
          description: Number of roster entries reserved for pending trades.
          type: integer

    RosterEntry:
      description:
        A description of a filled roster position. This includes when the roster
        spot was filled and the player that was acquired.
      type: object
      properties:
        acquisitionDate:
          description:
            The date the player was acquired to fill the roster spot. The date
            is formatted in milliseconds.
          type: integer
          example: 1634001405127
        acquisitionType:
          description: How the player was acquired to fill the roster spot.
          $ref: '#/components/schemas/AcquisitionType'
        injuryStatus:
          $ref: '#/components/schemas/InjuryStatus'
        lineupSlotId:
          description:
            The lineup slot ID in the fantasy team that the player currently
            occupies.
          $ref: '#/components/schemas/BasketballLineupSlotId'
        pendingTransactionIds:
          description:
            A list of transaction UUIDs currently pending that involve this
            player.
          type: array
          items:
            description: The UUID of the transaction associated with the player.
            type: string
            format: uuid
            example: efa9b89b-f7e5-4b41-ab11-6560b3baaf7c
          nullable: true
        playerId:
          description: The id of the player that occupies the roster spot.
          type: integer
          example: 3059318
        playerPoolEntry:
          description:
            Details related to the player that occupies a roster spot.
          $ref: '#/components/schemas/RosterPlayerPoolEntry'
        status:
          description: The transaction or lineup status of the roster entry.
          type: string
          enum:
            - NORMAL
            - FUTURE_DROP

    RosterPlayerPoolEntry:
      description: Information related to a player's role on a fantasy team.
      type: object
      properties:
        appliedStatTotal:
          type: number
          format: float
        id:
          description: The id of the player.
          type: integer
          example: 3059318
        keeperValue:
          description:
            The position in the team's keeper list that the player occupies. If
            0 the player is not on the team's keeper list.
          type: integer
          example: 1
        keeperValueFuture:
          type: integer
          example: 1
        lineupLocked:
          description:
            Whether the player's lineup slot is locked for today's games.
          type: boolean
        onTeamId:
          description:
            The id of the fantasy team in the league that the player is on.
          type: integer
          example: 3
        player:
          description:
            Information about the player not related to their spot on a fantasy
            team's roster.
          $ref: '#/components/schemas/RosterEntryPlayer'
        ratings:
          description:
            Information about how a player stacks up over different time
            segments.
          type: object
          properties:
            0:
              description: The player ratings for the current season to date.
              $ref: '#/components/schemas/PlayerRatings'
            1:
              description: The player ratings for the past 7 days.
              $ref: '#/components/schemas/PlayerRatings'
            2:
              description: The player ratings for the past 15 days.
              $ref: '#/components/schemas/PlayerRatings'
            3:
              description: The player ratings for the past 30 days.
              $ref: '#/components/schemas/PlayerRatings'
        rosterLocked:
          description:
            Whether the player has been locked into their roster spot for the
            day.
          type: boolean
        status:
          $ref: '#/components/schemas/PlayerPoolEntryStatus'
        tradeLocked:
          description:
            Whether the player is currently locked in an in-flight trade.
          type: boolean

    RosterEntryPlayer:
      description: The player details provided within a team roster.
      allOf:
        - $ref: '#/components/schemas/PlayerBasic'
        - type: object
          properties:
            active:
              description:
                Whether the player is currently on an active NBA roster.
              type: boolean
            draftRanksByRankType:
              description:
                Aggregate information about how the player ranks in the draft
                across different scoring formats.
              type: object
              properties:
                STANDARD:
                  description:
                    Draft ranking for standard head-to-head points or
                    categories.
                  $ref: '#/components/schemas/DraftRank'
                ROTO:
                  description: Draft ranking for rotisserie scoring formats.
                  $ref: '#/components/schemas/DraftRank'
            seasonOutlook:
              description:
                A text description written prior to the season that gives a
                summary of what to expect from the player during the season.
              type: string
            stats:
              description:
                A collection of player stat splits (e.g. season totals, recent
                7/15/30 days, projections).
              type: array
              items:
                $ref: '#/components/schemas/PlayerStatEntry'

    DraftRank:
      description: Information about how a player was ranked for a draft format.
      type: object
      properties:
        auctionValue:
          description:
            Suggested or projected auction draft budget value in dollars.
          type: integer
          example: 15
        published:
          description:
            Whether this draft ranking was officially published by ESPN.
          type: boolean
        rank:
          description: The numerical overall draft rank position.
          type: integer
          example: 45
        rankSourceId:
          description:
            Identifier for the ranking provider (0 represents ESPN default /
            consensus).
          type: integer
          example: 0
        rankType:
          description: The draft ranking scoring format.
          $ref: '#/components/schemas/DraftRankType'
        slotId:
          description:
            The lineup slot ID the ranking is associated with (0 for overall).
          type: integer
          example: 0

    DraftRankType:
      description: The fantasy format or scoring system used for draft rankings.
      type: string
      enum:
        - STANDARD
        - ROTO

    PlayerStatEntry:
      description: A statistical split or projection for a player.
      type: object
      properties:
        appliedAverage:
          description: The fantasy points average applied for this stat split.
          type: number
          format: float
        appliedTotal:
          description: Total applied fantasy points scored in this stat split.
          type: number
          format: float
        externalId:
          description:
            An identifier referencing the season year or external game ID.
          type: string
          example: '2027'
        id:
          description: Unique compound identifier for this stat record.
          type: string
          example: '002027'
        proTeamId:
          description: The NBA team ID the player was on for this stat record.
          type: integer
        scoringPeriodId:
          description:
            The scoring period (matchup period) this stat record belongs to.
          type: integer
        seasonId:
          description: The season year for this stat record.
          type: integer
        statSourceId:
          description:
            Indicator of whether stats are actual (0) or projected (1).
          type: integer
          enum:
            - 0 # Actual
            - 1 # Projected
        statSplitTypeId:
          description: The time window or scope of the statistics.
          type: integer
          enum:
            - 0 # Full season total
            - 1 # Last 7 days
            - 2 # Last 15 days
            - 3 # Last 30 days
            - 5 # Single game box score
        stats:
          $ref: '#/components/schemas/BasketballStats'
