openapi: 3.0.3
info:
  title: ESPN Fantasy API
  description:
    Unofficial OpenAPI specification for the ESPN Fantasy API (v3), focusing on
    Fantasy Basketball (`fba`). Responses vary based on the `view` query parameter.
  version: 1.0.0
servers:
  - url: https://lm-api-reads.fantasy.espn.com/apis/v3/games/
    description: ESPN Fantasy League Read API (recommended, avoids web WAF challenges)
  - url: https://fantasy.espn.com/apis/v3/games/
    description: ESPN Fantasy Web API
paths:
  /{sportId}/seasons/{seasonYear}/segments/0/leagues/{leagueId}:
    get:
      summary: 'Get basic league details'
      description:
        This GET request returns different response structures depending on the
        `view` query parameter. Inspect the response schemas to see the structures
        returned for each view.
      parameters:
        - in: path
          name: sportId
          description: The string-based ID of the fantasy sport (e.g. `fba` for basketball, `ffl` for football).
          required: true
          schema:
            type: string
            example: fba
        - in: path
          name: seasonYear
          description: The year of the fantasy season (>2018).
          required: true
          schema:
            type: integer
        - in: path
          name: leagueId
          description: The id of the fantasy league.
          required: true
          schema:
            type: integer
        - in: query
          name: view
          description: The type of data that you are looking for.
          required: false
          schema:
            $ref: '#/components/schemas/LeagueViews'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: './no-view-league.yml#/components/schemas/NoViewLeagueResponse'
                  - $ref: './mteam-league.yml#/components/schemas/MTeamLeagueResponse'
                  - $ref: './mroster-league.yml#/components/schemas/MRosterLeagueResponse'
                discriminator:
                  propertyName: view
                  mapping:
                    basic: './no-view-league.yml#/components/schemas/NoViewLeagueResponse'
                    mTeam: './mteam-league.yml#/components/schemas/MTeamLeagueResponse'
                    mRoster: './mroster-league.yml#/components/schemas/MRosterLeagueResponse'

components:
  schemas:
    LeagueViews:
      description:
        The different slices of data available from the
        /segments/0/leagues/{leagueId} endpoint.
      type: string
      enum:
        - mMatchup
        - mRoster
        - mSettings
        - mStandings
        - mTeam
