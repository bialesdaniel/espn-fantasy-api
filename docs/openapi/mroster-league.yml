openapi: 3.0.3
components:
  schemas:
    MRosterLeagueResponse:
      description:
        The response returned when the view query parameter is mRoster.
      allOf:
        - $ref: './shared-components.yml#/components/schemas/BasicLeagueResponse'
        - type: object
          properties:
            draftDetails:
              $ref: './shared-components.yml#/components/schemas/DraftDetails'
            status:
              $ref: './shared-components.yml#/components/schemas/LeagueStatusDetailed'
            teams:
              type: array
              items:
                $ref: '#/components/schemas/Team'

    Team:
      description:
        The league team that is returned when the view query parameter is
        mRoster.
      type: object
      properties:
        id:
          description:
            A unique identifier specific to the team, league, and season.
          type: integer
          minimum: 1
          example: 5
        roster:
          description: The details of the team's roster.
          $ref: './shared-components.yml#/components/schemas/Roster'

    Roster:
      $ref: './shared-components.yml#/components/schemas/Roster'

    RosterEntry:
      $ref: './shared-components.yml#/components/schemas/RosterEntry'

    RosterPlayerPoolEntry:
      $ref: './shared-components.yml#/components/schemas/RosterPlayerPoolEntry'

    RosterEntryPlayer:
      $ref: './shared-components.yml#/components/schemas/RosterEntryPlayer'

    DraftRank:
      $ref: './shared-components.yml#/components/schemas/DraftRank'

    DraftRankType:
      $ref: './shared-components.yml#/components/schemas/DraftRankType'

    PlayerStatEntry:
      $ref: './shared-components.yml#/components/schemas/PlayerStatEntry'
        