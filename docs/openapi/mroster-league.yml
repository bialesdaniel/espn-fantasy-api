openapi: 3.0.3
components:
  schemas:
    MRosterLeagueResponse:
      description:
        The response returned when the view query parameter is mRoster.
      allOf:
        - $ref: './shared-components.yml#/components/schemas/BasicLeagueResponse'
        - type: object
          properties:
            draftDetails:
              $ref: './shared-components.yml#/components/schemas/DraftDetails'
            status:
              $ref: './shared-components.yml#/components/schemas/LeagueStatusDetailed'
            teams:
              type: array
              items:
                $ref: '#/components/schemas/Team'

    Team:
      description:
        The league team that is returned when the view query parameter is
        mRoster.
      type: object
      properties:
        id:
          description:
            A unique identifier specific to the team, league, and season.
          type: integer
          minimum: 1
          example: 5
        roster:
          description: The details of the team's roster.
          $ref: '#/components/schemas/Roster'

    Roster:
      description: The roster of a team in the league.
      type: object
      properties:
        appliedStatTotal:
          type: number
          format: float
        entries:
          description: A list of the players on the team.
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
        tradeReservedEntries:
          type: number
          format: integer

    RosterEntry:
      description:
        A description of the filled roster position. This includes when the
        roster spot was filled and the player that was acquired.
      type: object
      properties:
        acquisitionDate:
          description:
            The date the player was acquired to fill the roster spot. The date
            is formatted in milliseconds.
          type: number
          format: integer
          example: 1634001405127
        acquisitionType:
          description: How the player was acquired to fill the roster spot.
          $ref: './shared-components.yml#/components/schemas/AcquisitionType'
        injuryStatus:
          $ref: './shared-components.yml#/components/schemas/InjuryStatus'
        lineupSlotId:
          description:
            The lineup slot ID in the fantasy team that the player currently occupies.
          $ref: './shared-components.yml#/components/schemas/BasketballLineupSlotId'
        pendingTransactionIds:
          description:
            A list of transaction UUIDs currently pending that involve this player.
          type: array
          items:
            description: The UUID of the transaction associated with the player.
            type: string
            format: uuid
            example: efa9b89b-f7e5-4b41-ab11-6560b3baaf7c
          nullable: true
        playerId:
          description: The id of the player that occupies the roster spot.
          type: integer
          example: 3059318
        playerPoolEntry:
          description:
            Details related to the player that occupies a roster spot.
          $ref: '#/components/schemas/RosterPlayerPoolEntry'
        status:
          description: The transaction or lineup status of the roster entry.
          type: string
          enum:
            - NORMAL
            - FUTURE_DROP

    RosterPlayerPoolEntry:
      description: Information related to a player's role on a fantasy team.
      type: object
      properties:
        appliedStatTotal:
          type: number
          format: float
        id:
          description: The id of the player.
          type: number
          format: integer
          example: 3059318
        keeperValue:
          description:
            The position in the team's keeper list that the player occupies. If
            0 the player is not on the team's keeper list.
          type: number
          format: integer
          example: 1
        keeperValueFuture:
          type: number
          format: integer
          example: 1
        lineupLocked:
          type: boolean
        onTeamId:
          description:
            The id of the fantasy team in the league that the player is on.
          type: number
          format: number
          example: 3
        player:
          description:
            Information about the player not related to their spot on a fantasy
            team's roster.
          $ref: '#/components/schemas/RosterEntryPlayer'
        ratings:
          description:
            Information about how a player stacks up over different time
            segments.
          type: object
          properties:
            0:
              description: The player ratings for the current season to date.
              $ref: './shared-components.yml#/components/schemas/PlayerRatings'
            1:
              description: The player ratings for the past 7 days.
              $ref: './shared-components.yml#/components/schemas/PlayerRatings'
            2:
              description: The player ratings for the past 15 days.
              $ref: './shared-components.yml#/components/schemas/PlayerRatings'
            3:
              description: The player ratings for the past 30 days.
              $ref: './shared-components.yml#/components/schemas/PlayerRatings'
        rosterLocked:
          description:
            Whether the player has been locked into their roster spot for the
            day.
          type: boolean
        status:
          $ref: './shared-components.yml#/components/schemas/PlayerPoolEntryStatus'
        tradeLocked:
          type: boolean

    RosterEntryPlayer:
      description:
        The player details provided when the view query parameter is mRoster.
      allOf:
        - $ref: './shared-components.yml#/components/schemas/PlayerBasic'
        - type: object
          properties:
            active:
              description: Whether the player is currently on an active NBA roster.
              type: boolean
            draftRanksByRankType:
              description:
                Aggregate information about how the player ranks in the draft across different scoring formats.
              type: object
              properties:
                STANDARD:
                  description: Draft ranking for standard head-to-head points or categories.
                  $ref: "#/components/schemas/DraftRank"
                ROTO:
                  description: Draft ranking for rotisserie scoring formats.
                  $ref: "#/components/schemas/DraftRank"
            seasonOutlook:
              description:
                A text description written prior to the season that gives a
                summary of what to expect from the player during the season.
              type: string
            stats:
              description:
                A collection of player stat splits (e.g. season totals, recent 7/15/30 days, projections).
              type: array
              items:
                $ref: '#/components/schemas/PlayerStatEntry'

    DraftRank:
      description: Information about how a player was ranked for a draft format.
      type: object
      properties:
        auctionValue: 
          description: Suggested or projected auction draft budget value in dollars.
          type: integer
          example: 15
        published:
          description: Whether this draft ranking was officially published by ESPN.
          type: boolean
        rank:
          description: The numerical overall draft rank position.
          type: integer
          example: 45
        rankSourceId:
          description: Identifier for the ranking provider (0 represents ESPN default / consensus).
          type: integer
          example: 0
        rankType:
          description: The draft ranking scoring format.
          $ref: "#/components/schemas/DraftRankType"
        slotId:
          description: The lineup slot ID the ranking is associated with (0 for overall).
          type: integer
          example: 0

    DraftRankType:
      description: The fantasy format or scoring system used for draft rankings.
      type: string
      enum:
        - STANDARD
        - ROTO

    PlayerStatEntry:
      description: A statistical split or projection for a player.
      type: object
      properties:
        appliedAverage:
          description: The fantasy points average applied for this stat split.
          type: number
          format: float
        appliedTotal:
          description: Total applied fantasy points scored in this stat split.
          type: number
          format: float
        externalId:
          description: An identifier referencing the season year or external game ID.
          type: string
          example: "2027"
        id:
          description: Unique compound identifier for this stat record.
          type: string
          example: "002027"
        proTeamId:
          description: The NBA team ID the player was on for this stat record.
          type: integer
        scoringPeriodId:
          description: The scoring period (matchup period) this stat record belongs to.
          type: integer
        seasonId:
          description: The season year for this stat record.
          type: integer
        statSourceId:
          description: Indicator of whether stats are actual (0) or projected (1).
          type: integer
          enum:
            - 0 # Actual
            - 1 # Projected
        statSplitTypeId:
          description: The time window or scope of the statistics.
          type: integer
          enum:
            - 0 # Full season total
            - 1 # Last 7 days
            - 2 # Last 15 days
            - 3 # Last 30 days
            - 5 # Single game box score
        stats:
          $ref: './shared-components.yml#/components/schemas/BasketballStats'
        